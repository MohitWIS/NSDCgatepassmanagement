<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalog</title>
  <script src="https://js.zohostatic.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
  <link rel="stylesheet" href="css/product.css">
</head>

<body>

  <!-- ================= top bar ================= -->
  <header class="topbar">
    <div class="brand">
      <span class="logo">KG</span>
      <span class="brand-name">KGN Corporate Gifting</span>
    </div>

    <div class="search">
      <svg class="search-icon" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-3.5-3.5" />
      </svg>
      <input type="search" id="searchInput" placeholder="Search products, SKU, supplier...">
    </div>

    <div class="topbar-right">
      <button class="icon-btn" type="button" id="wishBtn" aria-label="Wishlist">
        <svg viewBox="0 0 24 24">
          <path d="M12 20.5 4.2 13a4.7 4.7 0 0 1 6.6-6.7l1.2 1.1 1.2-1.1A4.7 4.7 0 0 1 19.8 13Z" />
        </svg>
        <em class="count" id="wishCount" hidden>0</em>
      </button>

      <div class="dropdown" data-dropdown>
        <button class="icon-btn bell" type="button" data-dropdown-toggle aria-label="Notifications">
          <svg viewBox="0 0 24 24">
            <path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" />
            <path d="M13.7 21a2 2 0 0 1-3.4 0" />
          </svg>
          <span class="dot"></span>
        </button>
        <div class="menu menu-wide" data-dropdown-menu>
          <p class="menu-head">Notifications</p>
          <div class="notif"><strong>PWB-045</strong> stock is below MOQ threshold</div>
          <div class="notif"><strong>3 new products</strong> added by Elite Promotions</div>
          <div class="notif">Quotation <strong>QT-2291</strong> is awaiting approval</div>
        </div>
      </div>

      <div class="dropdown" data-dropdown>
        <button class="user-btn" type="button" data-dropdown-toggle>
          <span class="avatar">MS</span>
          <span class="user-meta">
            <span class="user-name">Mohit Saxena</span>
            <span class="user-role">Admin</span>
          </span>
          <svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></svg>
        </button>
        <div class="menu" data-dropdown-menu>
          <button class="menu-item" type="button">My Profile</button>
          <button class="menu-item" type="button">Account Settings</button>
          <button class="menu-item" type="button">Sign Out</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ================= main ================= -->
  <main class="main">

    <div class="head">
      <div class="head-title">
        <h1 class="page-title">Product Catalog</h1>
        <p class="page-sub" id="pageSub"></p>
      </div>
      <button class="btn btn-primary" type="button" id="addProductBtn">
        <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
        Add Product
      </button>
    </div>

    <!-- ================= filter bar ================= -->
    <div class="filterbar">
      <div class="chip-scroll" id="categoryChips"></div>

      <div class="filter-row">
        <div class="chip-group" id="priceChips"></div>

        <div class="custom-price" id="customPrice" hidden>
          <input type="number" id="priceMin" placeholder="Min" min="0">
          <span class="dash">–</span>
          <input type="number" id="priceMax" placeholder="Max" min="0">
        </div>

        <select class="pill-select" id="brandingSelect" aria-label="Branding type"></select>
        <select class="pill-select" id="supplierSelect" aria-label="Supplier"></select>
        <select class="pill-select" id="moqSelect" aria-label="MOQ"></select>

        <div class="row-end">
          <select class="pill-select" id="sortSelect" aria-label="Sort by"></select>
          <div class="seg">
            <button class="seg-btn is-on" type="button" id="gridViewBtn" title="Grid view">
              <svg viewBox="0 0 24 24">
                <rect x="3" y="3" width="7" height="7" rx="1.5" />
                <rect x="14" y="3" width="7" height="7" rx="1.5" />
                <rect x="3" y="14" width="7" height="7" rx="1.5" />
                <rect x="14" y="14" width="7" height="7" rx="1.5" />
              </svg>
            </button>
            <button class="seg-btn" type="button" id="listViewBtn" title="List view">
              <svg viewBox="0 0 24 24">
                <path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01" />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div class="active-row" id="activeRow" hidden>
        <span class="active-label">Active:</span>
        <div class="tokens" id="activeTokens"></div>
        <button class="link-btn" type="button" id="clearAllBtn">Clear all</button>
      </div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="empty" id="empty" hidden>
      <svg class="empty-art" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-3.5-3.5" />
      </svg>
      <p class="empty-title">No products found</p>
      <p class="empty-sub">Try removing a filter or searching for something else.</p>
    </div>

    <div class="pager">
      <span class="results" id="resultsText"></span>
      <nav class="pages" id="pages" aria-label="Pagination"></nav>
      <label class="per-page">
        Show
        <select id="perPage">
          <option value="8">8</option>
          <option value="12">12</option>
          <option value="16">16</option>
          <option value="24">24</option>
        </select>
      </label>
    </div>
  </main>

  <!-- ================= add product modal ================= -->
  <div class="backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 class="modal-title" id="modalTitle">Add Product</h2>
        <button class="icon-btn plain" type="button" id="closeModalBtn" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></svg>
        </button>
      </div>

      <form class="modal-body" id="addProductForm">
        <div class="form-row">
          <label class="field">
            <span>Product Name</span>
            <input type="text" id="fName" required>
          </label>
          <label class="field">
            <span>SKU Code</span>
            <input type="text" id="fSku" placeholder="e.g. MUG-021" required>
          </label>
        </div>
        <div class="form-row">
          <label class="field">
            <span>Category</span>
            <select id="fCategory"></select>
          </label>
          <label class="field">
            <span>Supplier</span>
            <select id="fSupplier"></select>
          </label>
        </div>
        <div class="form-row">
          <label class="field">
            <span>Price (₹)</span>
            <input type="number" id="fPrice" min="0" step="1" required>
          </label>
          <label class="field">
            <span>MOQ (Pcs)</span>
            <input type="number" id="fMoq" min="1" step="1" value="50" required>
          </label>
        </div>
        <div class="form-row">
          <label class="field">
            <span>Branding Type</span>
            <select id="fBranding"></select>
          </label>
          <label class="field">
            <span>Badge</span>
            <select id="fBadge">
              <option value="">None</option>
              <option value="Best Seller">Best Seller</option>
              <option value="New Arrival">New Arrival</option>
            </select>
          </label>
        </div>
        <p class="form-error" id="formError" hidden></p>

        <div class="modal-foot">
          <button class="btn btn-ghost" type="button" id="cancelModalBtn">Cancel</button>
          <button class="btn btn-primary" type="submit">Add Product</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="product.js"></script>
</body>

</html>
